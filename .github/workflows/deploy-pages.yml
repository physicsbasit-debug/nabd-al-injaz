name: Build and deploy Nabd al-Injaz

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require the exact main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Release runs are permitted only from refs/heads/main."
            exit 1
          fi

  verify:
    needs: preflight
    uses: ./.github/workflows/verify.yml

  deploy:
    concurrency:
      group: github-pages
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout the verified commit
        uses: actions/checkout@v4
      - name: Confirm main still points to the verified commit
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "::error::The main branch advanced after this run began; refusing to deploy an older commit."
            exit 1
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

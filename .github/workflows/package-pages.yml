name: Package GitHub Pages artifact

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build for the Pages repository path
        run: npm run build -- --base=/nabd-al-injaz-pages/
      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: nabd-al-injaz-pages
          path: dist
          retention-days: 7
